welcome:
  headingUpdated: Focuser השתפר
  headingInstalled: תודה שהתקנת את Focuser
  introUpdated: מה השתנה בגרסה זו, ותזכורת קצרה לאופן הפעולה של המערכת.
  introInstalled: Focuser מסייע לשמור על ריכוז באמצעות חסימת אתרים ותוכנות מסיחי דעת. כאן אפשר להתחיל.
  setupTitle: נדרשת הגדרה אחת
  setupBody1: רשימות החסימה נשמרות בתוכנה במחשב, ולא בתוסף. התוסף מקבל מהתוכנה את הכללים וכך אותה רשימה חלה גם על הדפדפן וגם
    על התוכנות. השאר את Focuser פועל כדי שהחסימה בדפדפן תעבוד.
  setupBody2: כשהתוכנה סגורה, מופיע סימון אדום ליד סמל התוסף ושום אתר אינו נחסם. כך התוסף מציג את מצב ההגנה האמיתי.
  openApp: פתיחת Focuser
  getApp: הורדת היישום למחשב
  incognitoTitle: מתן הרשאה לתוסף בגלישה בסתר
  incognitoBody: הדפדפן {browser} אינו מפעיל תוספים בחלונות פרטיים ללא אישור. בזמן חסימה פעילה, Focuser יסגור את {browser}
    עד להפעלת ההרשאה.
  incognitoStepsChromium: פתח את הגדרות התוסף והפעל ״{setting}״.
  incognitoStepsFirefox: פתח את תפריט התוספים והערכות, בחר Focuser ואפשר את הפעלתו בחלונות פרטיים.
  incognitoSettingIncognito: אפשר בחלונות גלישה בסתר
  incognitoSettingInPrivate: אפשר בחלונות InPrivate
  incognitoSettingPrivate: אפשר בחלונות פרטיים
  incognitoReloadNote: שינוי ההגדרה יפעיל את התוסף מחדש, ולכן ייתכן שהעמוד הזה ייסגר. זהו מצב תקין.
  incognitoOpenSettings: פתיחת הגדרות התוסף
  versionBadge: גרסה {version}
  whatsNewVersion: מה חדש בגרסה {version}
  whatsNew: מה חדש
  new1Title: נבנה מחדש
  new1Body: התוסף נכתב מחדש. הוא קטן יותר, עולה מהר יותר, ואותו בסיס קוד תומך ב־Chrome, Edge, Brave ו־Firefox.
  new2Title: דף חסימה ברור
  new2Body: דף החסימה מציג את שם האתר, את הכלל שהופעל ואת מספר ניסיונות הגישה היום.
  new3Title: מצב החסימה ברור
  new3Body: חלונית התוסף מציגה באילו רשימות האתר באמת נמצא. הסרת חסימה מסירה אותו מכל הרשימות המתאימות.
  new4Title: האתר אינו מוצג לרגע
  new4Body: החסימה מופעלת לפני שהדף מצויר, כך שהתוכן החסום אינו מהבהב על המסך.
  point1Title: יותר מסינון דומיינים
  point1Body: ניתן לחסום אתר שלם, מילה בכתובת, תבנית או אזור מסוים באתר.
  point2Title: חסימה רק בזמנים שבחרת
  point2Body: אפשר להפעיל רשימות לפי לוח זמנים שבועי או למשך מחזור ריכוז אחד.
  point3Title: נשאר במחשב
  point3Body: התוסף מתקשר עם יישום Focuser במחשב שלך ולא עם שרת חיצוני.
  waysTitle: ארבע דרכים לחסום
  waysIntro: הוסף את הערכים בתוכנה תחת ״אתרים״. התוסף אוכף את ארבעת הסוגים.
