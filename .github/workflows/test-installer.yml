name: בדיקת מתקין PowerShell 5.1

on:
  push:
    branches: [main]
    paths:
      - "install-hebrew.ps1"
      - ".github/workflows/test-installer.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  test-on-windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: בדיקת קידוד ותחביר ב־Windows PowerShell 5.1
        shell: powershell
        run: |
          $path = Join-Path $PWD 'install-hebrew.ps1'
          $bytes = [IO.File]::ReadAllBytes($path)
          if ($bytes.Length -lt 3 -or $bytes[0] -ne 239 -or $bytes[1] -ne 187 -or $bytes[2] -ne 191) { throw 'UTF-8 BOM missing' }
          $t = $null; $errors = $null
          [Management.Automation.Language.Parser]::ParseFile($path, [ref]$t, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: הורדת חבילת Windows והתקנתה בתיקייה נפרדת
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\install-hebrew.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Installer returned nonzero exit code' }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Focuser-Hebrew'
          foreach ($item in @('Focuser-Hebrew.exe','focuser-cli.exe','focuser-native.exe')) {
            $p = Join-Path $dir $item
            if (-not (Test-Path $p)) { throw "Missing: $item" }
            $head = [IO.File]::ReadAllBytes($p)
            if ($head[0] -ne 77 -or $head[1] -ne 90) { throw "Invalid EXE header: $item" }
          }
          Write-Host 'Installer smoke test passed (Windows PowerShell 5.1)'
